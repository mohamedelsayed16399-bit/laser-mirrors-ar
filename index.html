<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ليزر المرايا</title>
<style>
html,body{margin:0;height:100%;background:#06060f;overflow:hidden;font-family:system-ui,Tahoma,sans-serif;color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700;font-size:16px}
canvas{position:fixed;left:0;top:50px;}
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}
button{font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#00b4ff,#9b3dff);border:0;border-radius:12px;padding:10px 18px;box-shadow:0 3px 14px #9b3dff55}
button.s{background:#1e1e3c;box-shadow:none}
.ov{position:fixed;inset:0;z-index:10;background:rgba(6,6,20,.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:24px!important;box-sizing:border-box;text-align:center;padding:14px;overflow:auto}
.ov.hide{display:none}
h1{margin:0;font-size:42px;background:linear-gradient(90deg,#0ff,#f0f,#ff0);-webkit-background-clip:text;color:transparent}
p{max-width:340px;line-height:1.5;opacity:.9;margin:6px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px;max-width:340px;width:90%}
.lv{aspect-ratio:1;border-radius:12px;background:#171736;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:2px solid #2c2c5c}
.lv small{font-size:10px;color:#fd6}
.lv.lock{opacity:.35}
</style></head><body>
<div id="top"><span id="lvl"></span><span id="mv"></span><span id="gem"></span></div>
<canvas id="c"></canvas>
<div id="bar"><button class="s" id="menub">القايمة</button><button class="s" id="undo">↩️ تراجع</button><button id="hint">💡 تلميح (3💎)</button><button class="s" id="reset">🔄</button></div>
<div class="ov" id="menu"><h1>ليزر المرايا</h1><p>💎 من المستوى 9: المنشور ◆ بيقسم الشعاع لفرعين، لازم تنوّر كل أهداف اللون.</p><p>وجّه أشعة الليزر لحد ما توصل للأهداف. دوس على المراية عشان تلفّها. كل مستوى مختلف وأصعب، وكل نجمة بتتحسب على عدد لفّاتك.</p><p id="sum"></p><div id="grid"></div></div>
<div class="ov hide" id="win"><h1>برافو!</h1><p id="wres"></p><button id="next">المستوى الجاي ◀</button><button class="s" id="wmenu">القايمة</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H,DPR,CS,OX,OY;
const SV='laser_mirrors_v1';let sv={stars:{},gems:6,snd:1,last:1,theme:0,own:[0],dayDone:''};try{Object.assign(sv,JSON.parse(localStorage.getItem(SV)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(SV,JSON.stringify(sv))}catch(e){}};
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let AC;function beep(f,d,t,v){if(!sv.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=t||'sine';o.frequency.value=f;gn.gain.value=v||.05;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const THEMES=[{n:'نيون',c:['#00e5ff','#ff3df0','#ffe600'],bg:'#0b0b22',cost:0},{n:'جمر',c:['#ff7a00','#ff2d55','#ffd60a'],bg:'#1c0a0a',cost:12},{n:'ماتريكس',c:['#39ff14','#00ffa3','#c6ff00'],bg:'#06140a',cost:25},{n:'جليد',c:['#9ad8ff','#ffffff','#b79bff'],bg:'#0a1424',cost:40}];
let COLS=THEMES[0].c;function setTheme(i){sv.theme=i;COLS=THEMES[i].c;persist()}
let L=null,parts=[],T=0,running=false,solvedAt=0;
// level generation
function gen(n){const rnd=mul(n*7919+13);const N=Math.min(4+Math.floor((n-1)/3),9);const nl=Math.min(1+Math.floor((n-1)/6),3);
 for(let attempt=0;attempt<200;attempt++){
  const used=new Set();const cells={};const lasers=[];let ok=true;
  const rows=[];const pool=[...Array(N).keys()];for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  for(let k=0;k<nl&&ok;k++){const r=pool[k];let x=0,y=r,dx=1,dy=0;if(used.has(x+','+y)){ok=false;break}
   const target=Math.max(4,Math.floor(N*(1.2+rnd()*.8)));let steps=0,sol=[];const path=[];
   const myCells=[];const strs=[];
   while(steps<60){const key=x+','+y;used.add(key);myCells.push(key);
    let turn=0;if(steps>=1)strs.push({x,y,dx,dy});
    if(steps>0&&steps>=target){cells[key]={t:'T',k};break}
    if(steps>=1&&rnd()<.5){// try to place mirror
      const opts=[];for(const m of['/','\\']){const nd=m==='/'?[-dy,-dx]:[dy,dx];const nx=x+nd[0],ny=y+nd[1];if(nx>=0&&ny>=0&&nx<N&&ny<N&&!used.has(nx+','+ny))opts.push([m,nd])}
      if(opts.length){const[m,nd]=opts[Math.floor(rnd()*opts.length)];cells[key]={t:'M',sol:m,k};dx=nd[0];dy=nd[1];turn=1}}
    const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=N||ny>=N||used.has(nx+','+ny)){if(!turn&&steps>=2){cells[key]={t:'T',k};break}else if(turn){ok=false;break}else{ok=false;break}}
    x=nx;y=ny;steps++;}
   if(n>=9&&rnd()<.6){const cand=strs.filter(q=>!cells[q.x+','+q.y]);for(let a=0;a<cand.length;a++){const q=cand[Math.floor(rnd()*cand.length)];const sd=rnd()<.5?1:-1;const bx=-q.dy*sd,by=q.dx*sd;let cx=q.x+bx,cy=q.y+by,len=0;const bc=[];while(cx>=0&&cy>=0&&cx<N&&cy<N&&!used.has(cx+','+cy)&&len<4){bc.push([cx,cy]);cx+=bx;cy+=by;len++}if(bc.length>=2){const len2=2+Math.floor(rnd()*(bc.length-1));for(let i=0;i<len2;i++)used.add(bc[i].join(','));const e=bc[len2-1];cells[q.x+','+q.y]={t:'P',k,bx,by};cells[e.join(',')]={t:'T',k};break}}}
   lasers.push({row:r,k});}
  if(!ok)continue;
  const tg=Object.values(cells).filter(c=>c.t==='T'&&!(cells&&0)).length;if(tg<nl)continue;
  // decoys and walls
  const total=N*N;const dec=Math.floor(total*.15)+Math.min(n,6);let tries=0,dcount=0;while(dcount<dec&&tries<100){tries++;const x=Math.floor(rnd()*N),y=Math.floor(rnd()*N);const key=x+','+y;if(used.has(key)||cells[key])continue;
   if(rnd()<.45)cells[key]={t:'W'};else cells[key]={t:'M',sol:rnd()<.5?'/':'\\',decoy:true};dcount++}
  // scramble
  let par=0;for(const key in cells){const c=cells[key];if(c.t==='M'){c.s=c.sol;if(!c.decoy&&rnd()<.7){c.s=c.sol==='/'?'\\':'/';par++}else if(c.decoy&&rnd()<.5)c.s=c.s==='/'?'\\':'/'}}
  if(par===0)continue;
  const lv={N,cells,lasers,par};if(solved(lv))continue;return lv}
 return null}
function trace(lv,las){const segs=[];const hits=new Set();const queue=[{x:0,y:las.row,dx:1,dy:0,px:-0.5,py:las.row}];let guard=0;
 while(queue.length&&guard<600){let{x,y,dx,dy,px,py}=queue.pop();
 for(let i=0;i<200;i++){guard++;const c=lv.cells[x+','+y];
  if(x<0||y<0||x>=lv.N||y>=lv.N){segs.push([px,py,x-dx*.4,y-dy*.4]);break}
  if(c){if(c.t==='W'){segs.push([px,py,x-dx*.4,y-dy*.4]);break}
   if(c.t==='T'){segs.push([px,py,x,y]);hits.add(c);break}
   if(c.t==='M'){segs.push([px,py,x,y]);px=x;py=y;const o=c.s==='/'?[-dy,-dx]:[dy,dx];dx=o[0];dy=o[1];x+=dx;y+=dy;continue}
   if(c.t==='P'){segs.push([px,py,x,y]);px=x;py=y;queue.push({x:x+c.bx,y:y+c.by,dx:c.bx,dy:c.by,px:x,py:y});x+=dx;y+=dy;continue}}
  x+=dx;y+=dy}}
 return{segs,hits}}
function solved(lv){return lv.lasers.every(l=>{const r=trace(lv,l);const need=Object.values(lv.cells).filter(c=>c.t==='T'&&c.k===l.k).length;let got=0;for(const h of r.hits)if(h.k===l.k)got++;return got===need})}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight-50-70;cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*DPR;cv.height=H*DPR;if(L)layout()}
function layout(){CS=Math.floor(Math.min(W-20,H-10)/(L.N+1));OX=(W-CS*L.N)/2+CS*.3;OY=(H-CS*L.N)/2}
addEventListener('resize',()=>{rs()});
let ta=null,daily=false,cur=1,moves=0,hist=[],hinted=null;
function startTA(){ta={i:0,t0:performance.now(),seed:Math.floor(Math.random()*40)};nextTA()}
function nextTA(){const lv=gen(8+ta.seed%20+ta.i*2);daily=false;L=lv||gen(8);moves=0;hist=[];hinted=null;solvedAt=0;parts=[];cur=-1;rs();layout();document.getElementById('menu').classList.add('hide');document.getElementById('win').classList.add('hide');upd();document.getElementById('lvl').textContent='⏱️ تحدي السرعة '+(ta.i+1)+'/5';if(!running){running=true;requestAnimationFrame(loop)}}
function dayNum(){return Math.floor((Date.now()+2*3600e3)/864e5)}
function startDaily(){ta=null;daily=true;const dn=dayNum();cur=1000+(dn%1000)*0+ (dn%50);L=gen(40+(dn%20)+1000*0);if(!L)L=gen(40);moves=0;hist=[];hinted=null;solvedAt=0;parts=[];rs();layout();document.getElementById('menu').classList.add('hide');document.getElementById('win').classList.add('hide');upd();document.getElementById('lvl').textContent='🌟 تحدي اليوم';if(!running){running=true;requestAnimationFrame(loop)}}
function start(n){ta=null;daily=false;cur=n;L=gen(n);if(!L){L=gen(n+1)}moves=0;hist=[];hinted=null;solvedAt=0;parts=[];rs();layout();document.getElementById('menu').classList.add('hide');document.getElementById('win').classList.add('hide');sv.last=n;persist();upd();if(!running){running=true;requestAnimationFrame(loop)}}
function upd(){document.getElementById('lvl').textContent='المستوى '+cur;document.getElementById('mv').textContent='لفّات: '+moves+' / مثالي '+L.par;document.getElementById('gem').textContent='💎 '+sv.gems}
cv.addEventListener('pointerdown',e=>{if(!L||solvedAt)return;const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left-OX)/CS),y=Math.floor((e.clientY-r.top-OY)/CS);const c=L.cells[x+','+y];if(c&&c.t==='M'){c.s=c.s==='/'?'\\':'/';moves++;hist.push(x+','+y);hinted=null;beep(420,.08,'square',.04);for(let i=0;i<6;i++)parts.push({x:x+.5,y:y+.5,vx:Math.random()-.5,vy:Math.random()-.5,l:.4,c:'#fff'});upd();if(solved(L))win()}});
document.getElementById('undo').onclick=()=>{if(!L||solvedAt||!hist.length)return;const k=hist.pop();const c=L.cells[k];c.s=c.s==='/'?'\\':'/';moves++;upd()};
document.getElementById('reset').onclick=()=>ta?nextTA():daily?startDaily():start(cur);
document.getElementById('hint').onclick=()=>{if(!L||solvedAt)return;if(sv.gems<3){beep(150,.2,'sawtooth');return}for(const k in L.cells){const c=L.cells[k];if(c.t==='M'&&!c.decoy&&c.s!==c.sol){sv.gems-=3;hinted=k;persist();upd();return}}};
document.getElementById('menub').onclick=()=>{ta=null;showMenu()};document.getElementById('wmenu').onclick=showMenu;
document.getElementById('next').onclick=()=>start(cur+1);persist();
function win(){if(ta){solvedAt=T;beep(880,.2,'sine',.07);ta.i++;if(ta.i>=5){const tm=(performance.now()-ta.t0)/1000;const nb=!sv.taBest||tm<sv.taBest;if(nb)sv.taBest=tm;persist();const r=tm.toFixed(1);ta=null;setTimeout(()=>{document.getElementById('wres').innerHTML='⏱️ خلصت 5 ألغاز في '+r+' ثانية'+(nb?'<br>🏆 رقم قياسي جديد!':'<br>أحسن وقت: '+sv.taBest.toFixed(1)+' ث');document.getElementById('next').style.display='none';document.getElementById('win').classList.remove('hide')},600)}else setTimeout(nextTA,500);return}
 solvedAt=T;const ex=moves-L.par;const st=ex<=0?3:ex<=2?2:1;let bonus='';if(daily){const k=String(dayNum());if(sv.dayDone!==k){sv.dayDone=k;sv.gems+=6+st*2;bonus='<br>🌟 جائزة التحدي اليومي: +'+(6+st*2)+'💎'}else bonus='<br>خدت جايزة النهارده قبل كده'}else{const old=sv.stars[cur]||0;if(st>old){sv.gems+=(st-old)*2;sv.stars[cur]=st}sv.gems+=1}persist();beep(660,.25,'sine',.07);setTimeout(()=>beep(880,.3,'sine',.07),180);setTimeout(()=>beep(1320,.4,'sine',.07),360);
 for(let i=0;i<60;i++)parts.push({x:L.N/2,y:L.N/2,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:1.2,c:COLS[i%3]});
 setTimeout(()=>{document.getElementById('wres').innerHTML='⭐'.repeat(st)+'☆'.repeat(3-st)+'<br>لفّاتك: '+moves+' (المثالي '+L.par+')'+bonus+'<br>💎 '+sv.gems;document.getElementById('next').style.display=daily?'none':'';document.getElementById('win').classList.remove('hide')},1100)}
function showMenu(){document.getElementById('win').classList.add('hide');const el=document.getElementById('grid');el.innerHTML='';const done=Object.keys(sv.stars).length;const maxu=Math.max(done+1,sv.last);let tot=0;for(const k in sv.stars)tot+=sv.stars[k];document.getElementById('sum').textContent='⭐ '+tot+' · 💎 '+sv.gems+' · خلّصت '+done+' مستوى';
 {const dd=document.createElement('button');dd.textContent=sv.dayDone===String(dayNum())?'🌟 تحدي اليوم (اتحل ✅)':'🌟 تحدي اليوم';dd.style.gridColumn='1 / -1';dd.onclick=startDaily;el.appendChild(dd);const tb=document.createElement('button');tb.className='s';tb.textContent='⏱️ تحدي السرعة: 5 ألغاز'+(sv.taBest?' (أحسن '+sv.taBest.toFixed(1)+' ث)':'');tb.style.gridColumn='1 / -1';tb.onclick=startTA;el.appendChild(tb);
  const th=document.createElement('div');th.style.cssText='grid-column:1/-1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap';THEMES.forEach((t,i)=>{const b=document.createElement('button');b.className='s';const own=(sv.own||[0]).includes(i);b.style.cssText='font-size:12px;padding:6px 10px;border:2px solid '+(sv.theme===i?'#fd6':'transparent')+';color:'+t.c[0];b.textContent=t.n+(own?'':' 💎'+t.cost);b.onclick=()=>{if(!own){if(sv.gems<t.cost)return;sv.gems-=t.cost;sv.own.push(i)}setTheme(i);showMenu()};th.appendChild(b)});el.appendChild(th)}
 for(let i=1;i<=60;i++){const d=document.createElement('div');const unl=i<=maxu+1;d.className='lv'+(unl?'':' lock');d.innerHTML=i+'<small>'+('⭐'.repeat(sv.stars[i]||0))+'</small>';if(unl)d.onclick=()=>start(i);el.appendChild(d)}
 document.getElementById('menu').classList.remove('hide')}
function X(x){return OX+x*CS}function Y(y){return OY+y*CS}
function loop(ts){T=ts/1000;if(ta&&!solvedAt)document.getElementById('mv').textContent='⏱️ '+((performance.now()-ta.t0)/1000).toFixed(1)+' ث';draw();requestAnimationFrame(loop)}
function draw(){g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);if(!L)return;
 g.fillStyle=THEMES[sv.theme||0].bg;g.fillRect(OX-6,OY-6,CS*L.N+12,CS*L.N+12);
 g.strokeStyle='#1d1d48';g.lineWidth=1;for(let i=0;i<=L.N;i++){g.beginPath();g.moveTo(X(i),Y(0));g.lineTo(X(i),Y(L.N));g.stroke();g.beginPath();g.moveTo(X(0),Y(i));g.lineTo(X(L.N),Y(i));g.stroke()}
 // beams
 const lit=[];for(const l of L.lasers){const r=trace(L,l);const col=COLS[l.k];g.shadowColor=col;g.shadowBlur=14;g.strokeStyle=col;g.lineWidth=4;g.lineCap='round';g.beginPath();for(const s of r.segs){g.moveTo(X(s[0]+.5),Y(s[1]+.5));g.lineTo(X(s[2]+.5),Y(s[3]+.5))}g.stroke();g.shadowBlur=0;g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();g.fillStyle='#fff';for(const s of r.segs){const len=Math.hypot(s[2]-s[0],s[3]-s[1]);const nd=Math.max(1,Math.round(len*1.5));for(let i=0;i<nd;i++){const f=((T*1.4+i/nd)%1);const px=s[0]+(s[2]-s[0])*((i+((T*2)%1))/nd),py=s[1]+(s[3]-s[1])*((i+((T*2)%1))/nd);g.globalAlpha=.9;g.beginPath();g.arc(X(px+.5),Y(py+.5),2.2,0,6.3);g.fill()}}g.globalAlpha=1;
  for(const h of r.hits)if(h.k===l.k)lit.push(h)}
 // laser sources
 for(const l of L.lasers){g.fillStyle=COLS[l.k];g.fillRect(X(-.5),Y(l.row+.5)-8,12,16)}
 // cells
 for(const key in L.cells){const[c,r]=key.split(',').map(Number);const cell=L.cells[key];const cx=X(c+.5),cy=Y(r+.5),h=CS*.36;
  if(cell.t==='W'){g.fillStyle='#3a3a5a';g.fillRect(cx-CS*.4,cy-CS*.4,CS*.8,CS*.8);g.strokeStyle='#5a5a8a';g.strokeRect(cx-CS*.4,cy-CS*.4,CS*.8,CS*.8)}
  else if(cell.t==='T'){const on=lit.includes(cell);g.fillStyle=on?COLS[cell.k]:'#222';g.strokeStyle=COLS[cell.k];g.lineWidth=3;g.shadowColor=COLS[cell.k];g.shadowBlur=on?22:0;g.beginPath();g.arc(cx,cy,CS*.3*(on?1+.1*Math.sin(T*8):1),0,6.3);g.fill();g.stroke();g.shadowBlur=0;g.beginPath();g.arc(cx,cy,CS*.12,0,6.3);g.fillStyle='#fff';g.fill()}
  else if(cell.t==='P'){g.fillStyle=COLS[cell.k];g.strokeStyle='#fff';g.lineWidth=2;g.save();g.translate(cx,cy);g.rotate(Math.PI/4);g.fillRect(-CS*.22,-CS*.22,CS*.44,CS*.44);g.strokeRect(-CS*.22,-CS*.22,CS*.44,CS*.44);g.restore();g.fillStyle='#fff';g.beginPath();g.moveTo(cx+cell.bx*CS*.35,cy+cell.by*CS*.35);g.lineTo(cx+cell.bx*CS*.12-cell.by*CS*.1,cy+cell.by*CS*.12+cell.bx*CS*.1);g.lineTo(cx+cell.bx*CS*.12+cell.by*CS*.1,cy+cell.by*CS*.12-cell.bx*CS*.1);g.fill()}
  else if(cell.t==='M'){g.fillStyle='rgba(255,255,255,.06)';g.fillRect(cx-CS*.45,cy-CS*.45,CS*.9,CS*.9);g.strokeStyle=hinted===key&&Math.floor(T*4)%2?'#fd6':'#cfe8ff';g.lineWidth=hinted===key?7:5;g.lineCap='round';g.beginPath();if(cell.s==='/'){g.moveTo(cx-h,cy+h);g.lineTo(cx+h,cy-h)}else{g.moveTo(cx-h,cy-h);g.lineTo(cx+h,cy+h)}g.stroke()}}
 if(cur===1&&moves===0&&!daily&&!ta&&!solvedAt){g.fillStyle='#fff';g.font='700 15px system-ui';g.textAlign='center';g.globalAlpha=.6+.4*Math.sin(T*5);g.fillText('👆 دوس على المراية عشان تلفها',W/2,OY+CS*L.N+28);g.globalAlpha=1}
 for(const p of parts){p.x+=p.vx*.02;p.y+=p.vy*.02;p.l-=.016}parts=parts.filter(p=>p.l>0);for(const p of parts){g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.fillRect(X(p.x),Y(p.y),4,4)}g.globalAlpha=1}
COLS=THEMES[sv.theme||0].c;rs();showMenu();
window.__t={start,state:()=>L,solved,gen,trace,click:(x,y)=>{const c=L.cells[x+','+y];if(c&&c.t==='M'){c.s=c.s==='/'?'\\':'/';moves++;if(solved(L))win()}}};
</script></body></html>
